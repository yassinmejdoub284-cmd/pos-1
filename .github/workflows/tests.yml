name: POS tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Build Windows portable application
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run build
      - name: Upload Windows executable
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Samurai-POS-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Samurai POS $version" --notes "Desktop Windows : modification du stock et prix des matières premières, correction du fond d'ouverture, alimentation caisse et remises client en pourcentage."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $exe = Get-ChildItem release/*.exe | Select-Object -ExpandProperty FullName
          gh release upload $tag $exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
